<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style type="text/css">
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            color: {foreground};
            font-family: "{font_family}", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: {font_size}px;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        a {
            color: {link_foreground};
            text-decoration: none;
            transition: opacity 0.15s ease;
        }

        a:hover {
            text-decoration: underline;
            opacity: 0.85;
        }

        h1, h2, h3, h4, h5, h6 {
            color: {foreground};
            font-weight: 600;
            line-height: 1.3;
            margin-top: 1.2em;
            margin-bottom: 0.6em;
        }

        h1 { font-size: 1.6em; }
        h2 { font-size: 1.4em; }
        h3 { font-size: 1.25em; }
        h4 { font-size: 1.1em; }
        h5, h6 { font-size: 1.0em; }

        p {
            margin: 0.8em 0;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            display: inline-block;
            vertical-align: middle;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
            font-size: 0.95em;
        }

        th, td {
            padding: 8px 12px;
            text-align: left;
            border: 1px solid rgba(128, 128, 128, 0.25);
        }

        th {
            background-color: rgba(128, 128, 128, 0.15);
            font-weight: 600;
        }

        tr:nth-child(even) td {
            background-color: rgba(128, 128, 128, 0.05);
        }

        blockquote {
            margin: 1em 0;
            padding: 8px 16px;
            border-left: 3px solid {link_foreground};
            background-color: rgba(128, 128, 128, 0.08);
            border-radius: 0 4px 4px 0;
        }

        code, pre {
            font-family: Consolas, "Courier New", monospace;
            font-size: 0.9em;
            border-radius: 3px;
        }

        code {
            padding: 2px 4px;
            background-color: rgba(128, 128, 128, 0.15);
        }

        pre {
            padding: 12px;
            overflow-x: auto;
            background-color: rgba(128, 128, 128, 0.12);
        }

        pre code {
            padding: 0;
            background-color: transparent;
        }

        hr {
            border: none;
            height: 1px;
            background-color: rgba(128, 128, 128, 0.25);
            margin: 1.5em 0;
        }

        ul, ol {
            padding-left: 1.5em;
            margin: 0.8em 0;
        }

        li {
            margin-bottom: 0.3em;
        }

        .spoiler {
            background-color: rgba(128, 128, 128, 0.4);
            color: transparent;
            cursor: pointer;
            border-radius: 2px;
            padding: 0 2px;
            user-select: none;
            transition: color 0.15s ease, background-color 0.15s ease;
        }

        .spoiler:hover {
            color: {foreground};
            background-color: transparent;
            user-select: auto;
        }
    </style>
    <title>Game Description</title>
</head>
<body>
<div>
{text}
</div>
</body>
</html>
